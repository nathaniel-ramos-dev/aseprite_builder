```yaml
name: Build and deploy Aseprite

on:
  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - master

  workflow_dispatch:

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - name: Get latest Aseprite release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag="$(gh api repos/aseprite/aseprite/releases/latest --jq '.tag_name')"

          echo "Latest Aseprite release: ${latest_tag}"

          if gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${latest_tag}" \
            >/dev/null 2>&1; then

            echo "Release ${latest_tag} already exists."
            echo "should_build=false" >> "$GITHUB_OUTPUT"

          else

            echo "Release ${latest_tag} does not exist."
            echo "should_build=true" >> "$GITHUB_OUTPUT"

          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

  build-aseprite:
    name: Build Aseprite (${{ matrix.os }})
    needs: check-version

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libpixman-1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            zlib1g-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            ninja-build \
            cmake \
            p7zip-full \
            unzip

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Checkout Aseprite
        shell: bash
        env:
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$ASEPRITE_TAG" \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/aseprite/aseprite.git \
            aseprite

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Download Skia
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            this_dir="$(cygpath "$GITHUB_WORKSPACE/aseprite")"
          else
            this_dir="$GITHUB_WORKSPACE/aseprite"
          fi

          skia_url="$(source "$this_dir/laf/misc/skia-url.sh" | xargs)"
          skia_file="$(basename "$skia_url")"

          echo "Downloading:"
          echo "$skia_url"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            -o "$skia_file" \
            "$skia_url"

          mkdir -p skia
          unzip "$skia_file" -d skia

      - name: Configure CMake
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            enable_ccache=off
          else
            enable_ccache=on
          fi

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DENABLE_CCACHE="${enable_ccache}" \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

      - name: Build Aseprite
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail

          cmake --build build --target aseprite --parallel

      - name: Prepare portable build
        shell: bash
        working-directory: aseprite/build/bin
        run: |
          set -euo pipefail

          printf '%s\n' \
            '# This file is here so Aseprite behaves as a portable program' \
            > aseprite.ini

          rm -f \
            gen \
            modp_b64_gen \
            gen.exe \
            gen.exe.manifest \
            modp_b64_gen.exe \
            modp_b64_gen.exe.manifest

      - name: Create ZIP
        shell: bash
        working-directory: aseprite/build/bin
        env:
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-${ASEPRITE_TAG}-${RUNNER_OS}.zip"

          7z \
            -tzip \
            a \
            "$archive" \
            ./*

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}
          path: aseprite/build/bin/Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ runner.os }}.zip
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub release
    needs:
      - check-version
      - build-aseprite

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-Windows
          path: release

      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v8
        with:
          name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-Linux
          path: release

      - name: Get upstream release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          gh api \
            "repos/aseprite/aseprite/releases/tags/${ASEPRITE_TAG}" \
            --jq '.body' \
            > release-notes.md

      - name: Create release and upload builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASEPRITE_TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          gh release create "$ASEPRITE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aseprite ${ASEPRITE_TAG}" \
            --notes-file release-notes.md \
            release/*.zip
```
